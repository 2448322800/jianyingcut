# 《剪映Cut》配置文件
# ─────────────────────────────────────────────────────────
# 改完直接保存，下次启动生效（启动器与所有 .command 都读这一个文件）。

# ── 程序本体目录 ──────────────────────────────────────────
# 源码 + 依赖 + 构建产物 + 运行数据（server/data、server/media）都在这里面。
# 默认取本文件同级的 app/；整个项目挪到别处时改这一行即可。
APP_DIR="$HOME/Desktop/06 工具与脚本/剪映Cut/app"

# 服务端口。页面地址 http://127.0.0.1:4000/
#   注意：8790 是「一站式ai漫剧工具」、8765 是「视频分发助手」、9222 是即梦调试端口，都不要用。
PORT=4000

# 启动时自动导入的目录（留空 = 不自动导入，进页面后自己点「目录」按钮）。
# 目录的第一层子文件夹名会自动成为素材分组名 —— 所以指向漫剧的片段目录，
# 左边直接就是按 E01 / E02 … 分好的素材。
IMPORT_DIR="$HOME/WorkBuddy/2026-10-05-17-28-54/02_数据/05_视频片段"

# 自动打开浏览器（1=打开，0=不打开）
OPEN_BROWSER=1

# 允许按路径导入的根目录白名单，逗号分隔。只有这里的目录能被导入。
# 默认已放开 WorkBuddy 工作区（项目都在那儿）。要导入别处就加进来。
IMPORT_ROOTS="$HOME/WorkBuddy"
